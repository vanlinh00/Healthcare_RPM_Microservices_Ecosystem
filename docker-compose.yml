version: '3.9'

services:
  # ----------------------------------------------------
  # PostgreSQL (Multi-database instance for Microservices)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "bash"
      - "-c"
      - |
        docker-entrypoint.sh postgres &
        until pg_isready -U postgres; do sleep 1; done
        psql -U postgres -c "CREATE DATABASE user_auth_db;" || true
        psql -U postgres -c "CREATE DATABASE appointment_db;" || true
        psql -U postgres -c "CREATE DATABASE care_dispatch_db;" || true
        psql -U postgres -c "CREATE DATABASE fulfillment_db;" || true
        psql -U postgres -c "CREATE DATABASE tracking_db;" || true
        psql -U postgres -c "CREATE DATABASE notification_db;" || true
        psql -U postgres -c "CREATE DATABASE keycloak_db;" || true
        wait
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - healthcare-network

  # ----------------------------------------------------
  # Redis (Distributed Locking & Cache)
  # ----------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: healthcare-redis
    command: redis-server --appendonly yes --requirepass redispassword
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthcare-network

  # ----------------------------------------------------
  # Apache Kafka (KRaft Mode - No Zookeeper Needed)
  # ----------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: healthcare-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - healthcare-network

  # ----------------------------------------------------
  # Elasticsearch (Medical Records & Telemetry Search)
  # ----------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: healthcare-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=healthcare-rpm-cluster
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - healthcare-network

  # ----------------------------------------------------
  # Kibana (Elasticsearch Dashboard & Analytics)
  # ----------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: healthcare-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - healthcare-network

  # ----------------------------------------------------
  # Keycloak 24 IAM (OIDC & Granular RBAC)
  # ----------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: healthcare-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpassword
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgrespassword
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realm-export.json:/opt/keycloak/data/import/healthcare-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - healthcare-network

  # ----------------------------------------------------
  # Kong API Gateway (DB-less Declarative Mode)
  # ----------------------------------------------------
  kong:
    image: kong:3.7-alpine
    container_name: healthcare-kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_PLUGINS: bundled
    ports:
      - "8000:8000"   # Kong HTTP Proxy
      - "8443:8443"   # Kong HTTPS Proxy
      - "8001:8001"   # Kong Admin API
      - "8444:8444"   # Kong Admin HTTPS
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthcare-network

  # ----------------------------------------------------
  # Prometheus (Microservice Metrics Scraper & Alerting)
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: healthcare-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - healthcare-network

  # ----------------------------------------------------
  # Grafana 11 (Unified Telemetry & Observability Dashboards)
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: healthcare-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=adminpassword
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/healthcare-microservices-overview.json
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - healthcare-network

networks:
  healthcare-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  es_data:
  prometheus_data:
  grafana_data:
