global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - '/etc/prometheus/alert.rules.yml'

scrape_configs:
  # ----------------------------------------------------
  # Prometheus Self-Monitoring
  # ----------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ----------------------------------------------------
  # Kong Cloud-Native API Gateway (Prometheus Plugin)
  # ----------------------------------------------------
  - job_name: 'kong-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kong:8001']

  # ----------------------------------------------------
  # Keycloak 24 IAM Metrics
  # ----------------------------------------------------
  - job_name: 'keycloak-iam'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['keycloak:8080']

  # ----------------------------------------------------
  # Netflix Eureka Service Discovery Registry
  # ----------------------------------------------------
  - job_name: 'service-registry'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['service-registry:8761']

  # ----------------------------------------------------
  # Core Healthcare & RPM Spring Boot 3.4 Microservices
  # ----------------------------------------------------
  - job_name: 'user-auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user-auth-service:8081']

  - job_name: 'appointment-order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['appointment-order-service:8082']

  - job_name: 'care-dispatch-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['care-dispatch-service:8083']

  - job_name: 'fulfillment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['fulfillment-service:8084']

  - job_name: 'tracking-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['tracking-service:8085']

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8086']

  - job_name: 'chat-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['chat-service:8087']

