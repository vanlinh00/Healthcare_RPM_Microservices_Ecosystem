server:
  port: 8081

spring:
  application:
    name: user-auth-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/user_auth_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/healthcare-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/healthcare-realm/protocol/openid-connect/certs}

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:healthcare-realm}
  resource: ${KEYCLOAK_CLIENT_ID:healthcare-api-gateway}
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:hExghH54qXgHTl3WnNJJ1nCW2dxeRBI1}
  admin:
    server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:healthcare-realm}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:hExghH54qXgHTl3WnNJJ1nCW2dxeRBI1}
    master-realm: master
    admin-username: ${KEYCLOAK_ADMIN_USER:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:adminpassword}
    connection-pool-size: 20
  google:
    client-id: ${KEYCLOAK_GOOGLE_CLIENT_ID:}
    client-secret: ${KEYCLOAK_GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${KEYCLOAK_GOOGLE_REDIRECT_URI:http://localhost:3000/auth/callback}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    filter: true
    doc-expansion: none
  show-actuator: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  group-configs:
    - group: "1-auth-mfa"
      displayName: "1. Authentication & MFA"
      paths-to-match: "/api/v1/auth/**"
    - group: "2-keycloak-iam-rbac"
      displayName: "2. Keycloak IAM & RBAC"
      paths-to-match: "/api/v1/iam/**"
    - group: "3-all-apis"
      displayName: "All APIs"
      paths-to-match: "/api/**"

logging:
  file:
    name: debug.log
  level:
    root: INFO
    com.healthcare.user: DEBUG
    com.healthcare: DEBUG
    org.keycloak: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
