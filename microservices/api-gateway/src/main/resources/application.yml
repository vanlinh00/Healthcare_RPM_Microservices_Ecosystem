server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redispassword}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/healthcare-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/healthcare-realm/protocol/openid-connect/certs}
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 50
            redis-rate-limiter.burstCapacity: 100
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: user-auth-service
          uri: lb://user-auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/doctors/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationRelay

        - id: appointment-order-service
          uri: lb://appointment-order-service
          predicates:
            - Path=/api/v1/appointments/**, /api/v1/consultations/**, /api/v1/pricing/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationRelay

        - id: care-dispatch-service
          uri: lb://care-dispatch-service
          predicates:
            - Path=/api/v1/dispatch/**, /api/v1/emergency/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationRelay

        - id: fulfillment-service
          uri: lb://fulfillment-service
          predicates:
            - Path=/api/v1/fulfillment/**, /api/v1/prescriptions/**, /api/v1/samples/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationRelay

        - id: tracking-service
          uri: lb://tracking-service
          predicates:
            - Path=/api/v1/telemetry/**, /api/v1/vitals/**, /api/v1/medical-records/**, /ws/rpm/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationRelay

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0
            - name: JwtAuthenticationRelay

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
