apiVersion: v1
kind: ConfigMap
metadata:
  name: healthcare-global-config
  namespace: healthcare-rpm
data:
  SPRING_PROFILES_ACTIVE: "kubernetes,production"
  EUREKA_SERVER_URL: "http://service-registry:8761/eureka/"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  ELASTICSEARCH_URIS: "http://elasticsearch:9200"
  KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/healthcare-realm"
  KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/healthcare-realm/protocol/openid-connect/certs"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: healthcare-rpm
data:
  kong.yml: |
    _format_version: "3.0"
    services:
      - name: user-auth-service
        url: http://user-auth-service:8081
        routes:
          - name: user-auth-routes
            paths:
              - /api/v1/auth
              - /api/v1/users
              - /api/v1/doctors
              - /api/v1/iam
            strip_path: false
            preserve_host: true
      - name: appointment-order-service
        url: http://appointment-order-service:8082
        routes:
          - name: appointment-routes
            paths:
              - /api/v1/appointments
              - /api/v1/consultations
              - /api/v1/pricing
            strip_path: false
            preserve_host: true
      - name: care-dispatch-service
        url: http://care-dispatch-service:8083
        routes:
          - name: care-dispatch-routes
            paths:
              - /api/v1/dispatch
              - /api/v1/emergency
            strip_path: false
            preserve_host: true
      - name: fulfillment-service
        url: http://fulfillment-service:8084
        routes:
          - name: fulfillment-routes
            paths:
              - /api/v1/fulfillment
              - /api/v1/prescriptions
              - /api/v1/samples
            strip_path: false
            preserve_host: true
      - name: tracking-service
        url: http://tracking-service:8085
        routes:
          - name: tracking-api-routes
            paths:
              - /api/v1/telemetry
              - /api/v1/vitals
              - /api/v1/medical-records
            strip_path: false
            preserve_host: true
          - name: tracking-websocket-routes
            paths:
              - /ws/rpm
            protocols:
              - http
              - https
              - ws
              - wss
            strip_path: false
            preserve_host: true
      - name: notification-service
        url: http://notification-service:8086
        routes:
          - name: notification-routes
            paths:
              - /api/v1/notifications
            strip_path: false
            preserve_host: true
      - name: keycloak-service
        url: http://keycloak:8080
        routes:
          - name: keycloak-routes
            paths:
              - /realms
              - /resources
              - /admin
            strip_path: false
            preserve_host: true
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
            - HEAD
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
            - X-Correlation-ID
            - X-User-Id
            - X-User-Role
          exposed_headers:
            - X-Correlation-ID
            - Authorization
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 300
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid#counter
          echo_downstream: true
      - name: prometheus
        config:
          per_consumer: false
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
          upstream_health_metrics: true

---
