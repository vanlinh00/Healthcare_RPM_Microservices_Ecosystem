apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry
  namespace: healthcare-rpm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-registry
  template:
    metadata:
      labels:
        app: service-registry
    spec:
      containers:
        - name: service-registry
          image: healthcare/service-registry:1.0.0
          ports:
            - containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: healthcare-rpm
spec:
  ports:
    - port: 8761
      name: http
  selector:
    app: service-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-gateway
  namespace: healthcare-rpm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kong-gateway
  template:
    metadata:
      labels:
        app: kong-gateway
    spec:
      containers:
        - name: kong
          image: kong:3.7
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000, 0.0.0.0:8443 ssl
            - name: KONG_PLUGINS
              value: bundled
          ports:
            - name: proxy
              containerPort: 8000
            - name: proxy-ssl
              containerPort: 8443
            - name: admin
              containerPort: 8001
            - name: admin-ssl
              containerPort: 8444
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: kong-config-volume
              mountPath: /etc/kong/kong.yml
              subPath: kong.yml
              readOnly: true
      volumes:
        - name: kong-config-volume
          configMap:
            name: kong-declarative-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-gateway
  namespace: healthcare-rpm
spec:
  type: LoadBalancer
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
    - name: proxy-ssl
      port: 8443
      targetPort: 8443
    - name: admin
      port: 8001
      targetPort: 8001
  selector:
    app: kong-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-order-service
  namespace: healthcare-rpm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: appointment-order-service
  template:
    metadata:
      labels:
        app: appointment-order-service
    spec:
      containers:
        - name: appointment-order-service
          image: healthcare/appointment-order-service:1.0.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: healthcare-global-config
            - secretRef:
                name: healthcare-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-order-service
  namespace: healthcare-rpm
spec:
  ports:
    - port: 8082
      name: http
  selector:
    app: appointment-order-service
---
