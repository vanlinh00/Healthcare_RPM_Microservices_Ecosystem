apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry
  namespace: healthcare-rpm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-registry
  template:
    metadata:
      labels:
        app: service-registry
    spec:
      containers:
        - name: service-registry
          image: healthcare/service-registry:1.0.0
          ports:
            - containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: healthcare-rpm
spec:
  ports:
    - port: 8761
      name: http
  selector:
    app: service-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: healthcare-rpm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: healthcare/api-gateway:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: healthcare-global-config
            - secretRef:
                name: healthcare-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: healthcare-rpm
spec:
  ports:
    - port: 8080
      name: http
  selector:
    app: api-gateway
---
